apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventguesser
  namespace: eventguesser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventguesser
  template:
    metadata:
      labels:
        app: eventguesser
    spec:
      containers:
        - name: app
          image: yingrjimsch/eventguesser:v0.0.1
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/data
              readOnly: true
            - name: panoramas
              mountPath: /usr/share/nginx/html/panoramas
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /srv/worldcup-guesser/data
            type: Directory
        - name: panoramas
          hostPath:
            path: /srv/worldcup-guesser/panoramas
            type: Directory
