apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventguesser
  namespace: eventguesser
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventguesser
  template:
    metadata:
      labels:
        app: eventguesser
    spec:
      containers:
        - name: app
          image: yingrjimsch/eventguesser:v0.0.1
          ports:
            - containerPort: 8080
          env:
            - name: GITHUB_REPOSITORY
              value: Yingrjimsch/eventguesser
            - name: GITHUB_REPORT_LABEL
              value: image-report
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: eventguesser-github
                  key: token
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: panoramas
              mountPath: /app/panoramas
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
      volumes:
        - name: data
          hostPath:
            path: /home/raspi/development/eventguesser/data
            type: Directory
        - name: panoramas
          hostPath:
            path: /home/raspi/development/eventguesser/panoramas
            type: Directory
